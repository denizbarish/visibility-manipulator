      <text x="764" y="110" text-anchor="middle" font-weight="600" fill="#312e81">Load unpacked</text>
      <text x="764" y="134" text-anchor="middle" fill="#3730a3">pick the folder</text>
    </g>
  </g>
  <line x1="211" y1="100" x2="236" y2="100" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="427" y1="100" x2="452" y2="100" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="643" y1="100" x2="668" y2="100" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
