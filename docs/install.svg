<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="880" height="200" rx="16" fill="#ffffff"/>
  <g font-size="14">
    <g>
      <rect x="24" y="40" width="184" height="120" rx="12" fill="#f3f4f6" stroke="#d1d5db"/>
      <circle cx="52" cy="68" r="14" fill="#4338ca"/>
      <text x="52" y="73" text-anchor="middle" font-weight="700" fill="#ffffff">1</text>
      <text x="116" y="110" text-anchor="middle" font-weight="600" fill="#111827">Download ZIP</text>
      <text x="116" y="134" text-anchor="middle" fill="#4b5563">and unzip it</text>
    </g>
    <g>
      <rect x="240" y="40" width="184" height="120" rx="12" fill="#f3f4f6" stroke="#d1d5db"/>
      <circle cx="268" cy="68" r="14" fill="#4338ca"/>
      <text x="268" y="73" text-anchor="middle" font-weight="700" fill="#ffffff">2</text>
      <text x="332" y="110" text-anchor="middle" font-weight="600" fill="#111827">Open</text>
      <text x="332" y="134" text-anchor="middle" fill="#4b5563">chrome://extensions</text>
    </g>
    <g>
      <rect x="456" y="40" width="184" height="120" rx="12" fill="#f3f4f6" stroke="#d1d5db"/>
      <circle cx="484" cy="68" r="14" fill="#4338ca"/>
      <text x="484" y="73" text-anchor="middle" font-weight="700" fill="#ffffff">3</text>
      <text x="548" y="110" text-anchor="middle" font-weight="600" fill="#111827">Turn on</text>
      <text x="548" y="134" text-anchor="middle" fill="#4b5563">Developer mode</text>
    </g>
    <g>
      <rect x="672" y="40" width="184" height="120" rx="12" fill="#e0e7ff" stroke="#a5b4fc"/>
